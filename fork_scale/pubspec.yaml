name: fork_scale
description: "ForkScale — on-device food calorie estimator using fork/knife as a scale reference."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Localization (en + de)
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.1.0

  # Navigation
  go_router: ^17.3.0

  # Camera & image
  camera: ^0.12.0
  image_picker: ^1.1.2
  image: ^4.2.0

  # Local storage
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Secure storage for the Gemini API key (Keychain / EncryptedSharedPreferences)
  flutter_secure_storage: ^10.3.1

  # Networking
  http: ^1.3.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  fl_chart: ^1.2.0
  share_plus: ^11.0.0
  mobile_scanner: ^7.0.0
  cached_network_image: ^3.3.0
  archive: ^4.0.9
  file_picker: ^11.0.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/db/usda_nutrition.db
    - assets/db/sfcd.db

# App launcher icon (regenerate masters via scripts/build_app_icon.py, then run
# `dart run flutter_launcher_icons`).
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#1B4332"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

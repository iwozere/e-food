name: fork_scale
description: "ForkScale — on-device food calorie estimator using fork/knife as a scale reference."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Localization (en + de)
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Camera & image
  camera: ^0.12.0
  image_picker: ^1.1.2
  image: ^4.2.0

  # Local storage
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Secure storage for the Gemini API key (Keychain / EncryptedSharedPreferences)
  flutter_secure_storage: ^9.2.4

  # Networking
  http: ^1.3.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  fl_chart: ^0.68.0
  share_plus: ^10.0.0
  mobile_scanner: ^7.0.0
  cached_network_image: ^3.3.0
  archive: ^3.4.0
  file_picker: ^8.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/db/usda_nutrition.db
    - assets/db/sfcd.db
